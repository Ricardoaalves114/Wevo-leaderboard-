<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wevo Challenge · Leaderboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
:root{--bg:#0e0e10;--fg:#f4f1ea;--cream:#ecdebc;--mut:#a8a69f;--line:#2a2a2e;--panel:#17171a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Barlow Condensed','Arial Narrow',sans-serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:20px;padding:20px 28px 12px;flex-wrap:wrap}
header img{height:52px;max-width:40vw}
.ttl{font-family:'Anton',Impact,sans-serif;font-size:46px;letter-spacing:2px;text-transform:uppercase;line-height:1}
.sub{color:var(--cream);font-size:22px;letter-spacing:3px;text-transform:uppercase;font-weight:700}
.tools{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input,button{font:inherit;color:inherit}
.tools input{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:10px 14px;font-size:22px;width:230px}
.btn{background:var(--cream);color:#0e0e10;border:0;border-radius:8px;padding:10px 20px;font-size:22px;font-weight:700;letter-spacing:2px;text-transform:uppercase;min-height:48px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.btn.on{border-color:var(--cream);color:var(--cream)}
#st{color:var(--mut);font-size:18px;letter-spacing:2px;text-transform:uppercase}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:8px 28px 24px}
@media(max-width:760px){main{grid-template-columns:1fr;overflow:auto}}
section{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-radius:14px;padding:18px 22px}
h2{margin:0 0 10px;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:54px;letter-spacing:3px;color:var(--cream)}
.hd,.r{display:grid;grid-template-columns:36px minmax(0,1fr) 46px 46px 62px;align-items:center;gap:6px}
body.mg .hd,body.mg .r{grid-template-columns:36px minmax(0,1fr) 46px 46px 62px 36px}
.hd{color:var(--mut);font-size:17px;letter-spacing:1px;text-transform:uppercase;padding:0 0 6px;border-bottom:2px solid var(--line)}
ol{list-style:none;margin:0;padding:0;overflow-y:auto;flex:1}
.r{font-size:32px;font-weight:700;padding:9px 0;border-bottom:1px solid var(--line)}
.r .nm{font-size:20px;white-space:normal;overflow-wrap:anywhere;line-height:1.05;text-transform:uppercase}
.hd span:nth-child(n+3),.r .n,.r .tot{text-align:right}
.r .tot{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:36px}
.r .pos{color:var(--mut)}
.r.t1,.r.t2,.r.t3{color:var(--cream)}
.r.t1 .pos,.r.t2 .pos,.r.t3 .pos{color:var(--cream)}
.r.dim{opacity:.25}
.r.hit{background:#2b2618;outline:2px solid var(--cream);outline-offset:-2px}
.x{background:none;border:0;color:var(--mut);font-size:28px;cursor:pointer;min-width:36px;min-height:44px;display:none}
body.mg .x{display:block}
.empty{color:var(--mut);font-size:24px;padding:24px 0}
#pan{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px}
#pan.open{display:flex}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:28px;width:min(520px,100%);display:flex;flex-direction:column;gap:16px}
.card h3{margin:0;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:38px;letter-spacing:2px;color:var(--cream)}
.card label{display:flex;flex-direction:column;gap:6px;font-size:20px;letter-spacing:2px;text-transform:uppercase;color:var(--mut)}
.card input{background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px 14px;font-size:28px;color:var(--fg)}
.seg{display:flex;gap:10px}
.seg button{flex:1;background:var(--bg);border:2px solid var(--line);border-radius:8px;padding:12px;font-size:26px;font-weight:700;letter-spacing:2px;cursor:pointer;min-height:52px}
.seg button.on{background:var(--cream);color:#0e0e10;border-color:var(--cream)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.acts{display:flex;gap:10px;justify-content:flex-end}
#err{color:#ff9b8a;font-size:20px;min-height:24px}
</style>
</head>

<div><div class="ttl">Challenge</div><div class="sub">Row + Air Bike · 1 min max calories</div></div>
<div class="tools">
<span id="st"></span>
<input id="q" type="search" placeholder="Find your name" aria-label="Find your name">
<button class="btn" id="add">+ Add result</button>
<button class="btn ghost" id="mg">Manage</button>
<button class="btn ghost" id="ex">Export</button>
</div>
</header>
<main>
<section><h2>Men</h2><div class="hd"><span>#</span><span>Name</span><span>Bike</span><span>Row</span><span>Total</span><span></span></div><ol id="M"></ol></section>
<section><h2>Women</h2><div class="hd"><span>#</span><span>Name</span><span>Bike</span><span>Row</span><span>Total</span><span></span></div><ol id="F"></ol></section>
</main>
<div id="pan" role="dialog" aria-modal="true" aria-label="Add result">
<div class="card">
<h3>Add result</h3>
<label>Name<input id="fn" type="text" autocomplete="off" maxlength="40"></label>
<div class="seg"><button id="cm" class="on">Men</button><button id="cf">Women</button></div>
<div class="two">
<label>Air bike (cal)<input id="fb" type="number" inputmode="numeric" min="0" max="99"></label>
<label>Row (cal)<input id="fr" type="number" inputmode="numeric" min="0" max="99"></label>
</div>
<div id="err"></div>
<div class="acts"><button class="btn ghost" id="cx">Cancel</button><button class="btn" id="sv">Save</button></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
let entries=[],db=null,cat='M',mg=false,q='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tot=e=>(+e.bike||0)+(+e.row||0);
const better=(a,b)=>tot(a)>tot(b)||(tot(a)===tot(b)&&(+a.row||0)>(+b.row||0));
function draw(){
for(const c of ['M','F']){
const l=entries.filter(e=>e.cat===c).sort((a,b)=>tot(b)-tot(a)||(+b.row||0)-(+a.row||0)||String(a.name).localeCompare(String(b.name)));
$('#'+c).innerHTML=l.length?l.map(e=>{
const rk=1+l.filter(o=>better(o,e)).length;
const m=q&&String(e.name).toLowerCase().includes(q);
const cl='r'+(rk<=3?' t'+rk:'')+(q?(m?' hit':' dim'):'');
return `<li class="${cl}"><span class="pos">${rk}</span><span class="nm">${esc(e.name)}</span><span class="n">${+e.bike||0}</span><span class="n">${+e.row||0}</span><span class="tot">${tot(e)}</span><button class="x" data-id="${esc(e.id)}" aria-label="Delete ${esc(e.name)}">×</button></li>`}).join(''):'<div class="empty">No results yet</div>';
}}
function loadLocal(){try{entries=JSON.parse(localStorage.getItem('wevo-lb')||'[]')}catch(e){entries=[]}draw()}
function saveLocal(){try{localStorage.setItem('wevo-lb',JSON.stringify(entries))}catch(e){}}
function init(){loadLocal();$('#st').textContent='Saved on this device'}
function openP(){$('#fn').value='';$('#fb').value='';$('#fr').value='';$('#err').textContent='';$('#pan').classList.add('open');$('#fn').focus()}
function closeP(){$('#pan').classList.remove('open')}
function setCat(c){cat=c;$('#cm').classList.toggle('on',c==='M');$('#cf').classList.toggle('on',c==='F')}
async function save(){
const name=$('#fn').value.trim(),bike=parseInt($('#fb').value,10),row=parseInt($('#fr').value,10);
if(!name||isNaN(bike)||isNaN(row)||bike<0||row<0){$('#err').textContent='Fill in name, bike and row.';return}
const d={name,cat,bike,row,t:Date.now()};
try{
if(db){await db.collection('entries').add(d)}
else{entries.push({id:'l'+d.t,...d});saveLocal();draw()}
closeP();
}catch(e){$('#err').textContent='Could not save. Try again.'}
}
async function del(id){
try{
if(db){await db.collection('entries').doc(id).delete()}
else{entries=entries.filter(e=>e.id!==id);saveLocal();draw()}
}catch(e){}
}
$('#ex').onclick=()=>{const h='category,name,bike,row,total\n';const r=entries.map(e=>[e.cat==='M'?'Men':'Women','"'+String(e.name).replace(/"/g,'""')+'"',+e.bike||0,+e.row||0,tot(e)].join(',')).join('\n');const u=URL.createObjectURL(new Blob([h+r],{type:'text/csv'}));const a=document.createElement('a');a.href=u;a.download='wevo-challenge-results.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
$('#add').onclick=openP;$('#cx').onclick=closeP;$('#sv').onclick=save;
$('#cm').onclick=()=>setCat('M');$('#cf').onclick=()=>setCat('F');
$('#mg').onclick=()=>{mg=!mg;document.body.classList.toggle('mg',mg);$('#mg').classList.toggle('on',mg)};
$('#q').oninput=e=>{q=e.target.value.trim().toLowerCase();draw()};
$('#pan').addEventListener('keydown',e=>{if(e.key==='Enter')save();if(e.key==='Escape')closeP()});
document.addEventListener('click',e=>{const b=e.target.closest('.x');if(b&&confirm('Delete this result?'))del(b.dataset.id)});
init();
</script>
</body>
</html>
